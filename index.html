<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APU Library Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0a0f1a;
            --surface: #111827;
            --border:  rgba(255,255,255,0.08);
            --primary: #6366f1;
            --accent:  #34d399;
            --text:    #e2e8f0;
            --muted:   #64748b;
            --danger:  #f87171;
            --r:       12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .shell {
            width: 100%;
            max-width: 700px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .85rem 1.1rem;
            border-bottom: 1px solid var(--border);
            gap: .75rem;
        }

        .hL { display: flex; align-items: center; gap: .65rem; }

        .avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 9px;
            display: grid; place-items: center;
            font-size: 1rem; flex-shrink: 0;
        }

        .htitle { font-size: .9rem; font-weight: 600; color: #fff; }
        .hsub   { font-size: .7rem; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: .3rem; }

        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

        /* Colab URL config */
        #colabConfig {
            display: flex;
            gap: .4rem;
            align-items: center;
        }

        #colabUrl {
            background: rgba(0,0,0,.3);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: #a5b4fc;
            font-size: .72rem;
            font-family: monospace;
            padding: .3rem .6rem;
            width: 220px;
            outline: none;
        }
        #colabUrl:focus { border-color: var(--primary); }
        #colabUrl::placeholder { color: var(--muted); }

        .btn-connect {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: .72rem;
            font-weight: 600;
            padding: .3rem .65rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-connect:hover { opacity: .85; }

        /* ── Messages ── */
        #messages {
            height: 460px;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: .85rem;
            scroll-behavior: smooth;
        }
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

        .row { display: flex; align-items: flex-end; gap: .55rem; animation: up .2s ease-out; }
        @keyframes up { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .row.user { flex-direction: row-reverse; }

        .av {
            width: 26px; height: 26px; border-radius: 7px;
            display: grid; place-items: center; font-size: .72rem; font-weight:600; flex-shrink:0;
        }
        .av.ai   { background: linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; }
        .av.user { background: rgba(255,255,255,.08); color: var(--muted); }

        .bwrap { max-width: 80%; display:flex; flex-direction:column; gap:.2rem; }

        .bubble {
            padding: .65rem .9rem;
            border-radius: var(--r);
            font-size: .855rem;
            line-height: 1.65;
            word-wrap: break-word;
        }
        .bubble.ai   { background:rgba(255,255,255,.04); border:1px solid var(--border); border-bottom-left-radius:3px; }
        .bubble.user { background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.3); border-bottom-right-radius:3px; color:#c7d2fe; }

        .ts { font-size:.63rem; color:var(--muted); padding:0 .2rem; }
        .row.user .ts { text-align:right; }

        /* Instruction notice */
        .notice {
            background: rgba(99,102,241,.07);
            border: 1px solid rgba(99,102,241,.2);
            border-radius: 8px;
            padding: .6rem .85rem;
            font-size: .78rem;
            color: #a5b4fc;
            line-height: 1.65;
            margin-top: .3rem;
        }
        .notice code {
            background: rgba(255,255,255,.07);
            border-radius: 4px;
            padding: .08rem .3rem;
            font-size: .74rem;
            color: #818cf8;
        }

        /* Error / fallback banner */
        .fallback {
            background: rgba(248,113,113,.07);
            border: 1px solid rgba(248,113,113,.22);
            border-radius: 8px;
            padding: .6rem .85rem;
            font-size: .8rem;
            color: #fca5a5;
            line-height: 1.6;
            margin-top: .3rem;
        }

        /* Typing */
        .typing span {
            display:inline-block; width:6px; height:6px;
            background:var(--muted); border-radius:50%; margin:0 2px;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2){animation-delay:.2s}
        .typing span:nth-child(3){animation-delay:.4s}
        @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px);background:var(--primary)} }

        /* ── Input ── */
        .input-row {
            display: flex;
            align-items: flex-end;
            gap: .5rem;
            padding: .75rem 1rem .9rem;
            border-top: 1px solid var(--border);
        }

        #userInput {
            flex: 1;
            background: rgba(0,0,0,.25);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: .855rem;
            padding: .6rem .85rem;
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 100px;
            line-height: 1.4;
            transition: border-color .2s;
        }
        #userInput:focus { border-color: rgba(99,102,241,.5); }
        #userInput::placeholder { color: var(--muted); }

        #sendBtn {
            width: 40px; height: 40px;
            background: var(--primary);
            border: none; border-radius: 9px;
            color: #fff; font-size: 1rem;
            display: grid; place-items: center;
            cursor: pointer; flex-shrink: 0;
            transition: opacity .15s, transform .15s;
        }
        #sendBtn:hover  { opacity:.85; transform:translateY(-1px); }
        #sendBtn:active { transform:scale(.93); }

        footer {
            margin-top: .65rem;
            font-size: .66rem;
            color: var(--muted);
            text-align: center;
        }

        @media(max-width:580px) {
            #messages { height: 400px; }
            #colabUrl { width: 140px; }
            .bwrap { max-width:88%; }
        }
    </style>
</head>
<body>

<div class="shell">

    <!-- Header -->
    <header>
        <div class="hL">
            <div class="avatar">📚</div>
            <div>
                <div class="htitle">APU Library Assistant</div>
                <div class="hsub"><span class="dot"></span><span id="statusTxt">Connecting…</span></div>
            </div>
        </div>

        <!-- Colab URL config -->
        <div id="colabConfig">
            <input id="colabUrl" type="text" placeholder="Paste ngrok URL…" />
            <button class="btn-connect" onclick="connect()">Connect</button>
        </div>
    </header>

    <!-- Messages -->
    <div id="messages" role="log" aria-live="polite"></div>

    <!-- Input -->
    <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Ask about books, hours, rooms, fines…"></textarea>
        <button id="sendBtn" onclick="sendMessage()" aria-label="Send">➤</button>
    </div>

</div>

<footer>APU Library Chatbot · Powered by Google Colab · Assignment Demo</footer>

<script>
/* ── Config ── */
let COLAB_URL = localStorage.getItem('colab_url') || '';

function connect() {
    let url = document.getElementById('colabUrl').value.trim().replace(/\/+$/, '');
    if (!url) { alert('Please paste your Colab ngrok URL.'); return; }
    COLAB_URL = url;
    localStorage.setItem('colab_url', url);
    document.getElementById('colabUrl').value = url;
    setStatus('Pinging server…', false);
    ping();
}

async function ping() {
    try {
        const r = await fetch(`${COLAB_URL}/ping`, {
            headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const d = await r.json();
        setStatus(`Colab · ${d.books_loaded || 80} books`, true);
        addMsg(`Connected to Colab backend.<br><small style="color:var(--muted)">${d.server || 'Library AI Server'}</small>`, 'ai');
    } catch {
        setStatus('No Colab — fallback mode', false);
    }
}

function setStatus(txt, ok) {
    document.getElementById('statusTxt').textContent = txt;
    document.querySelector('.dot').style.background = ok ? 'var(--accent)' : 'var(--danger)';
}

/* ── Chat ── */
function addMsg(html, who) {
    const box  = document.getElementById('messages');
    const row  = el('div', `row ${who}`);
    const av   = el('div', `av ${who}`); av.textContent = who==='ai'?'AI':'U';
    const wrap = el('div', 'bwrap');
    const bbl  = el('div', `bubble ${who}`); bbl.innerHTML = html;
    const ts   = el('div', 'ts');
    ts.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    wrap.append(bbl, ts); row.append(av, wrap); box.append(row);
    box.scrollTop = box.scrollHeight;
}

function el(tag, cls) { const e=document.createElement(tag); e.className=cls; return e; }

function showTyping() {
    const box=document.getElementById('messages');
    const row=el('div','row ai'); row.id='typing';
    const av=el('div','av ai'); av.textContent='AI';
    const w=el('div','bwrap');
    const b=el('div','bubble ai typing'); b.innerHTML='<span></span><span></span><span></span>';
    w.append(b); row.append(av,w); box.append(row);
    box.scrollTop=box.scrollHeight;
}
function rmTyping() { const t=document.getElementById('typing'); if(t)t.remove(); }

function esc(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

async function sendMessage() {
    const inp = document.getElementById('userInput');
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = ''; inp.style.height = '';
    addMsg(esc(txt), 'user');
    showTyping();

    try {
        if (!COLAB_URL) throw new Error('No Colab URL configured.');

        const res = await fetch(`${COLAB_URL}/chat`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true'
            },
            body: JSON.stringify({ message: txt })
        });

        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const data = await res.json();
        rmTyping();

        /* ANSWER SATISFIED? YES → display accurate answer */
        addMsg(data.reply || data.response || data.message || '(empty response)', 'ai');

    } catch (err) {
        rmTyping();
        /* ANSWER SATISFIED? NO → fallback & offer library form */
        addMsg(`
            <div class="fallback">
                <strong>Could not reach Colab backend.</strong><br>
                ${err.message}<br><br>
                Please paste your ngrok URL in the header and click <strong>Connect</strong>,
                or contact the library at <strong>library@apu.edu.my</strong>.
            </div>`, 'ai');
    }
}

/* Auto-resize textarea */
document.getElementById('userInput').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

/* Enter to send */
document.getElementById('userInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* ── On Load: Welcome + instruction notice (flowchart step: Welcome Message) ── */
window.addEventListener('load', () => {
    if (COLAB_URL) {
        document.getElementById('colabUrl').value = COLAB_URL;
        ping();
    } else {
        setStatus('No Colab URL set', false);
    }

    addMsg(`
        Welcome to the <strong>APU Library AI Assistant</strong>! 👋
        <div class="notice">
            <strong>How to use:</strong><br>
            • Search books — type a title, author, or topic<br>
            • Borrow a book — e.g. <code>borrow B01 for TP012345</code><br>
            • Return a book — e.g. <code>return B01 for TP012345</code><br>
            • Study rooms — type <code>rooms</code> or <code>book R01 for TP012345</code><br>
            • Library hours — type <code>hours</code><br>
            • Overdue fines — type <code>fines</code><br>
            • Policies — type <code>policies</code><br><br>
            <strong>Note:</strong> Paste your Colab ngrok URL in the top-right to connect the AI backend.
        </div>`, 'ai');
});
</script>

</body>
</html>
